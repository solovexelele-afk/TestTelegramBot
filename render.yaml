# Render Blueprint: https://render.com/docs/blueprint-spec
# Бесплатный Web Service в режиме webhook.
# Автодеплой: Render сам деплоит каждый новый коммит в main (Auto-Deploy: On Commit).
# Резервный вариант — Deploy Hook из Settings сервиса.
services:
  - type: web
    name: testtelegrambot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BOT_MODE
        value: webhook
      - key: LOG_LEVEL
        value: INFO
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: KEEP_ALIVE
        value: "true"   # самопинг /health каждые 10 мин — бесплатный инстанс не засыпает
      - key: BOT_TOKEN
        sync: false   # секрет: вводится вручную в панели Render
      - key: GEMINI_API_KEY
        sync: false   # секрет: бесплатный ключ с aistudio.google.com/apikey
      # DATABASE_URL (необязательно): PostgreSQL, например бесплатный Neon —
      # без него используется SQLite, который очищается при каждом деплое.
