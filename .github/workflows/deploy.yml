name: CI

# Проверка кода при каждом push. Сам деплой делает Render (Auto-Deploy: On Commit).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax / import check
        run: |
          python -m compileall -q bot
          python -c "from bot.__main__ import build_dispatcher; build_dispatcher()"
